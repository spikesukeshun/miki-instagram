name: Instagram自動投稿

on:
  schedule:
    # post_scheduler.py は「投稿日時 <= 現在時刻」の行だけを投稿するため、
    # 何度発火しても重複投稿にはならない。発火回数を増やすほど取りこぼしが減る。
    #
    # ⚠️ 以前は「Actions は約6時間遅れて発火する」前提で投稿時刻の6時間前に
    # 設定していたが、2026-08-08 の実測では遅延は約30分だった（UTC 6:00 設定 →
    # 6:31 発火）。6時間ずらす前提は成り立たなくなっているので、
    # **投稿時刻そのものに合わせて設定する**。
    #
    # 実際の投稿枠: 月22:00 / 木21:00 / 金22:00 JST（＝ UTC 12:00・13:00）
    - cron: "0 12 * * *"   # JST 21:00 — 木曜枠
    - cron: "0 13 * * *"   # JST 22:00 — 月・金曜枠
    - cron: "30 14 * * *"  # JST 23:30 — 上2つが遅延・失敗したときの取りこぼし回収
    - cron: "0 21 * * *"   # JST  6:00 — 前夜に出せなかった分の最終回収
  workflow_dispatch:  # 手動実行 / ローカル定期タスクからの発火（GOの代わり）

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 投稿後にgenerated/{slug}/を削除するために必要
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: credentials.jsonを復元
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: echo "$GOOGLE_CREDENTIALS" > credentials.json

      - name: credentials.jsonを検証
        run: |
          python3 -c "
          import json, sys
          content = open('credentials.json').read().strip()
          if not content:
              print('ERROR: GOOGLE_CREDENTIALS シークレットが空です')
              sys.exit(1)
          try:
              data = json.loads(content)
          except json.JSONDecodeError as e:
              print(f'ERROR: JSONが不正です: {e}')
              sys.exit(1)
          if data.get('type') != 'service_account':
              print('ERROR: type が service_account ではありません')
              sys.exit(1)
          print(f'OK: credentials 検証完了 (project_id={data.get(\"project_id\",\"?\")})')
          "

      - name: 自動投稿を実行
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID_SHUNSUKE: ${{ secrets.LINE_USER_ID_SHUNSUKE }}
          LINE_USER_ID_MIKI: ${{ secrets.LINE_USER_ID_MIKI }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python post_scheduler.py

      - name: 失敗時LINE通知
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID_SHUNSUKE: ${{ secrets.LINE_USER_ID_SHUNSUKE }}
          LINE_USER_ID_MIKI: ${{ secrets.LINE_USER_ID_MIKI }}
        run: |
          python3 -c "
          import os, sys
          sys.path.insert(0, '.')
          from line_notify import send_line_message
          send_line_message('❌ GitHub Actions 失敗: post.yml\n自動投稿ワークフローでエラーが発生しました。\nGitHub Actions のログを確認してください。')
          "
